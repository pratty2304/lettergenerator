<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Letter Generator — KIMS MACS</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#4a6fa5" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="generator">
  <header class="site-header no-print">
    <a href="index.html" class="back-link">← Back</a>
    <img src="assets/kims-logo.png" alt="KIMS MACS" class="logo small" />
    <div class="tagline" id="letterTitle">Letter</div>
  </header>

  <main class="generator-shell" aria-busy="true">
    <aside class="form-panel no-print">
      <h2 class="panel-title">Letter details</h2>
      <form id="letterForm" autocomplete="on"></form>
      <div class="actions">
        <button type="button" id="generateBtn" class="btn primary">Generate</button>
        <button type="button" id="saveBtn" class="btn ghost">Save</button>
        <button type="button" id="printBtn" class="btn ghost">Print / Save PDF</button>
        <button type="button" id="resetBtn" class="btn ghost">Reset</button>
      </div>
      <div class="archive-box">
        <div class="archive-head">
          <h3>Saved letters</h3>
          <span id="savedCount">0 / 50</span>
        </div>
        <select id="savedLetterSelect" aria-label="Saved letters">
          <option value="">No saved letters</option>
        </select>
        <div class="archive-actions">
          <button type="button" id="loadSavedBtn" class="btn ghost">Load</button>
          <button type="button" id="deleteSavedBtn" class="btn ghost danger">Delete</button>
        </div>
        <p class="archive-status" id="archiveStatus"></p>
      </div>
      <p class="hint">The draft can be edited directly while entering details. Generate rebuilds the letter from the form.</p>
    </aside>

    <section class="preview-panel">
      <article id="letterPreview" class="letter-page" contenteditable="true">
        <div class="empty-state">
          <p>Preparing letter draft...</p>
        </div>
      </article>
    </section>
  </main>

  <script src="js/doctors.js"></script>
  <script src="js/drugs.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
